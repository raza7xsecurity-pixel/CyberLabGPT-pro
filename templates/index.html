<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>raza7x.hacker gpt - AI Cybersecurity Assistant</title>
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif;}
    body {background: linear-gradient(135deg, #0f172a, #1e293b); color:#e2e8f0; display:flex; flex-direction:column; height:100vh;}
    header {background:#1e293b; padding:12px 15px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #7c3aed;}
    header h1 {color:#a78bfa; font-size:18px;}
    #clearBtn {background:#ef4444; border:none; padding:6px 12px; border-radius:6px; color:white; cursor:pointer; font-size:12px;}
    #chat {flex:1; overflow-y:auto; padding:15px;}
   .msg {margin:10px 0; padding:12px; border-radius:12px; max-width:85%; white-space:pre-wrap;}
   .user {background:#7c3aed; margin-left:auto; text-align:right;}
   .bot {background:#334155; margin-right:auto;}
    #input-area {display:flex; padding:10px; background:#1e293b; border-top:2px solid #334155;}
    #question {flex:1; padding:12px; border:none; border-radius:8px; background:#334155; color:white; outline:none;}
    button {margin-left:8px; padding:12px; border:none; border-radius:8px; background:#7c3aed; color:white; cursor:pointer;}
    button:active {transform:scale(0.95);}
    #installBtn {display:none; position:fixed; bottom:70px; right:15px; background:#22c55e;}
    code {background:#0f172a; padding:2px 6px; border-radius:4px; color:#22d3ee;}
  </style>
</head>
<body>
  <header>
    <h1>🛡️ raza7x.hacker gpt</h1>
    <button id="clearBtn" onclick="clearChat()">Clear Chat</button>
  </header>

  <div id="chat">
    <div class="msg bot">Hello! I am raza7x.hacker gpt. 
I remember our conversation. Ask me anything about Cybersecurity, Hacking, Networking.</div>
  </div>

  <div id="input-area">
    <input type="text" id="question" placeholder="Ask anything..." autocomplete="off">
    <button id="micBtn">🎤</button>
    <button id="sendBtn">Send</button>
  </div>

  <button id="installBtn">Install App</button>

<script>
const chat = document.getElementById('chat');
const question = document.getElementById('question');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');

// SEND MESSAGE
async function sendMessage() {
  const text = question.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  question.value = '';

  const res = await fetch('/ask', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({question: text})
  });
  const data = await res.json();
  addMsg(data.answer, 'bot');
}

function addMsg(text, sender) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  // code highlight
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  div.innerHTML = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

sendBtn.onclick = sendMessage;
question.addEventListener('keypress', e => {if(e.key==='Enter') sendMessage();});

// CLEAR CHAT
async function clearChat(){
  await fetch('/clear', {method:'POST'});
  chat.innerHTML = '<div class="msg bot">History cleared. New chat started.</div>';
}

// VOICE
const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang = 'en-IN';
micBtn.onclick = () => recognition.start();
recognition.onresult = e => {question.value = e.results[0][0].transcript; sendMessage();}

// PWA INSTALL
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
document.getElementById('installBtn').onclick = async () => {
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  document.getElementById('installBtn').style.display = 'none';
}

// REGISTER SERVICE WORKER
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/service-worker.js');
}
</script>
</body>
</html>
