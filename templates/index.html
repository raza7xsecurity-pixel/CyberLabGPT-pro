<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberLabGPT Pro</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f1724">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="brand">
        <img src="/icon-192.png" alt="logo" class="logo">
        <div>
          <h1>CyberLabGPT Pro</h1>
          <p class="tag">Cybersecurity & Ethical Hacking assistant — Hindi supported</p>
        </div>
      </div>
    </header>

    <section id="chatContainer" class="card">
      <div id="chatBox" class="chatBox" aria-live="polite"></div>
    </section>

    <form id="composer" class="composer" onsubmit="return false;">
      <button id="micBtn" class="btn mic" title="Voice input">🎤</button>
      <input aria-label="प्रश्न लिखें" type="text" id="userInput" placeholder="यहाँ लिखें या बोलें..." autocomplete="off">
      <button id="hifi" class="btn send">Send</button>
    </form>

    <footer class="footer">Powered by Groq • Keep prompts concise for best results</footer>
  </main>

  <script>
  // Helper: escape HTML to avoid injection
  function escapeHtml(str){
    if(!str) return '';
    return str.replace(/[&<>\"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));
  }

  const chatBox = document.getElementById('chatBox');
  const sendBtn = document.getElementById('hifi');
  const inputEl = document.getElementById('userInput');

  async function sendQuestion(){
    const text = inputEl.value.trim();
    if(!text) return;
    appendMessage('user', text);
    setBusy(true);
    inputEl.value = '';

    try{
      const res = await fetch('/ask', {method:'POST',headers:{'Content-Type':'application/json'},body: JSON.stringify({question: text})});
      const data = await res.json();
      if(res.ok){
        appendMessage('ai', data.answer || 'No answer');
        speak(data.answer || '');
      } else {
        appendMessage('ai', 'त्रुटि: ' + (data.error || 'सर्वर समस्या'));
      }
    } catch(err){
      appendMessage('ai', 'सर्वर से जुड़ाव असफल');
      console.error(err);
    } finally{
      setBusy(false);
    }
  }

  function appendMessage(who, text){
    const div = document.createElement('div');
    div.className = 'message ' + who;
    div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function setBusy(flag){
    if(flag){
      sendBtn.disabled = true; sendBtn.classList.add('loading');
    } else {
      sendBtn.disabled = false; sendBtn.classList.remove('loading');
    }
  }

  sendBtn.addEventListener('click', sendQuestion);
  inputEl.addEventListener('keypress', e => { if(e.key === 'Enter') sendQuestion(); });

  // Speech recognition (STT)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SpeechRecognition){
    const recognition = new SpeechRecognition();
    recognition.lang = 'hi-IN';
    recognition.continuous = false;
    const micBtn = document.getElementById('micBtn');
    let listening = false;
    micBtn.addEventListener('click', (e) =>{
      e.preventDefault();
      if(!listening){ recognition.start(); micBtn.classList.add('active'); listening = true; }
      else { recognition.stop(); micBtn.classList.remove('active'); listening = false; }
    });

    recognition.onresult = (ev) => { inputEl.value = ev.results[0][0].transcript; sendQuestion(); };
    recognition.onend = () => { listening = false; document.getElementById('micBtn').classList.remove('active'); };
  } else {
    document.getElementById('micBtn').style.display = 'none';
  }

  // Text-to-speech (TTS) safer use
  function speak(text){
    if(!('speechSynthesis' in window) || !text) return;
    try{ window.speechSynthesis.cancel(); const ut = new SpeechSynthesisUtterance(text); ut.lang = 'hi-IN'; ut.rate = 1; window.speechSynthesis.speak(ut); } catch(e){ console.warn(e); }
  }
  </script>

</body>
</html>
