    * {margin:0; padding:0; box-sizing:border-box; font-family: 'SF Pro Display', sans-serif;}
  
  body {
    background: linear-gradient(180deg, #000428 0%, #004e92 100%);
    color: #fff; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden;
  }
  /* Water Ripple Background */
  body::before { 
    content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
    background: radial-gradient(circle, rgba(0,200,255,0.15) 0%, transparent 70%);
    animation: ripple 15s infinite linear;
  }
  @keyframes ripple { 0% {transform: rotate(0deg);} 100% {transform: rotate(360deg);} }
