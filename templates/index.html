<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberLabGPT-pro</title>
  <style>
    body { background: #000428; color: white; font-family: Arial, sans-serif; padding: 20px; max-width: 700px; margin: auto; }
    #chatBox { border: 1px solid #007aff; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; border-radius: 8px; background: rgba(0, 0, 0, 0.2); }
    .user { text-align: right; color: #00ff88; margin: 8px 0; font-weight: bold; }
    .ai { text-align: left; color: #00aaff; margin: 8px 0; }
    input { width: 55%; padding: 12px; border-radius: 8px; border: none; font-size: 16px; }
    button { padding: 12px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
    #hifi { background: #007aff; color: white; }
    #micBtn { background: #00ff88; color: black; }
    #stopBtn { background: red; color: white; }
  </style>
</head>
<body>

  <h1>raza7x.hacker gpt 🤖</h1>

  <div id="chatBox"></div>

  <input type="text" id="userInput" placeholder="Yaha likho ya bolo...">
  <button id="hifi">Send</button>
  <button id="micBtn">🎤 Bolo</button>
  <button id="stopBtn" style="display:none;">🔇 Stop</button>

<script>
// ========== 1. FLASK BACKEND INTERACTION ==========
document.getElementById('hifi').onclick = async () => {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;

  const chatBox = document.getElementById('chatBox');
  chatBox.innerHTML += `<div class="user">You: ${text}</div>`;
  input.value = '';
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    // API request directed safely to your local Flask route
    const response = await fetch("/ask", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ "question": text })
    });

    const data = await response.json();
    
    if (response.ok) {
      showAIReply(data.answer); 
    } else {
      showAIReply("Error: " + (data.error || "Kuch gadbad hui"));
    }

  } catch (error) {
    showAIReply("Error: Server se connect nahi ho paaya");
    console.error(error);
  }
}

function showAIReply(aiText){
    const chatBox = document.getElementById('chatBox');
    chatBox.innerHTML += `<div class="ai">AI: ${aiText}</div>`;
    speak(aiText); 
    chatBox.scrollTop = chatBox.scrollHeight;
}

document.getElementById('userInput').addEventListener("keypress", function(e) {
  if (e.key === "Enter") document.getElementById('hifi').click();
});

// ========== 2. SPEECH TO TEXT (STT) ==========
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'hi-IN'; 
  recognition.continuous = false;

  const micBtn = document.getElementById('micBtn');
  const stopBtn = document.getElementById('stopBtn');

  micBtn.onclick = () => {
    recognition.start();
    micBtn.style.display = 'none';
    stopBtn.style.display = 'inline-block';
  }

  stopBtn.onclick = () => recognition.stop();

  recognition.onresult = (event) => {
    const voiceText = event.results[0][0].transcript;
    document.getElementById('userInput').value = voiceText;
    document.getElementById('hifi').click(); 
  }

  recognition.onend = () => {
    micBtn.style.display = 'inline-block';
    stopBtn.style.display = 'none';
  }
} else {
  console.log("Speech recognition not supported in this browser.");
  document.getElementById('micBtn').style.display = 'none';
}

// ========== 3. TEXT TO SPEECH (TTS) ==========
function speak(text){
  window.speechSynthesis.cancel(); 
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = 'hi-IN'; 
  speech.rate = 1.1; 
  window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
