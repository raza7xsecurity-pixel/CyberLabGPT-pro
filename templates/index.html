<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberGPT Pro</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1a1a">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap');
    * {margin:0; padding:0; box-sizing:border-box; font-family: 'Google Sans', Arial, sans-serif;}

  body {
    background: #131314;
    color: #e3e3e3;
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* HEADER */
 .header {
    padding: 15px 25px;
    border-bottom: 1px solid #2e2e2e;
    font-size: 20px;
    font-weight: 500;
    color: #fff;
  }
 .header span { color: #8ab4f8; }

  /* CHAT AREA */
 .chat-box {
    flex:1;
    overflow-y:auto;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
 .chat-box::-webkit-scrollbar {width: 8px;}
 .chat-box::-webkit-scrollbar-thumb {background: #3c4043; border-radius:10px;}

 .msg {margin: 20px 0; line-height:1.7; font-size:16px; display:flex; gap:15px;}
 .msg.icon {font-size:24px; width:30px;}
 .user.icon {color: #8ab4f8;}
 .bot.icon {color: #c4b5fd;}
 .msg-content {flex:1;}

  /* INPUT AREA */
 .input-area {
    padding: 15px 20px;
    border-top: 1px solid #2e2e2e;
  }
 .input-box {
    max-width: 900px;
    margin: 0 auto;
    display:flex;
    gap:10px;
    align-items:center;
    padding:12px 18px;
    background: #1e1f20;
    border: 1px solid #3c4043;
    border-radius: 25px;
  }
  input[type="text"] {
    flex:1;
    padding:8px;
    border:none;
    background:transparent;
    color:#e3e3e3;
    outline:none;
    font-size:16px;
  }
  input::placeholder {color: #9aa0a6;}

  button {
    width: 40px; height: 40px; border:none; border-radius:50%;
    background: transparent;
    color:#9aa0a6; font-size:20px; cursor:pointer; transition:0.2s;
    display:flex; justify-content:center; align-items:center;
  }
  button:hover {background: #2e2e2e; color:#fff;}
  #sendBtn {background: #8ab4f8; color: #000;}
  #sendBtn:hover {background: #a8c7fa;}
  #preview {max-width:120px; border-radius:12px; margin:10px 0; border:1px solid #3c4043;}
</style>
</head>
<body>

<div class="header">⚡ <span>CyberGPT Pro</span></div>

<div class="chat-box" id="chat">
  <div class="msg bot">
    <div class="icon">⚡</div>
    <div class="msg-content">Hello! I am <b>CyberGPT Pro</b>. Ask me about Cybersecurity, Ethical Hacking, or upload an Image / use Voice 🎤</div>
  </div>
</div>

<img id="preview" style="display:none; margin:0 auto; max-width:900px;">

<div class="input-area">
  <div class="input-box">
    <input type="file" id="imageInput" accept="image/*" style="display:none;">
    <button onclick="document.getElementById('imageInput').click()" title="Upload Image">📷</button>
    <button onclick="startVoice()" title="Voice Input">🎤</button>
    <input type="text" id="q" placeholder="Ask CyberGPT Pro anything...">
    <button id="sendBtn" onclick="send()" title="Send">➤</button>
  </div>
</div>

<script>
// 1. IMAGE UPLOAD
let imageBase64 = null;
document.getElementById('imageInput').onchange = e => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = () => {
    imageBase64 = reader.result;
    document.getElementById('preview').src = imageBase64;
    document.getElementById('preview').style.display = 'block';
  }
  reader.readAsDataURL(file);
}

// 2. VOICE INPUT
function startVoice(){
  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = 'en-US';
  rec.onresult = e => document.getElementById('q').value = e.results[0][0].transcript;
  rec.start();
}

// 3. CHAT SEND
async function send(){
  const q = document.getElementById('q').value;
  if(!q &&!imageBase64) return;
  addMsg(q, 'user');
  document.getElementById('q').value = '';
  document.getElementById('preview').style.display = 'none';

  const res = await fetch('/ask', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({question:q, image:imageBase64})
  });
  const data = await res.json();
  addMsg(data.answer, 'bot');
  imageBase64 = null;
}

// 4. ADD MESSAGE TO CHAT
function addMsg(text, who){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  const icon = who === 'user'? '👤' : '⚡';
  d.innerHTML = `<div class="icon">${icon}</div><div class="msg-content">${text.replace(/\*\*/g,'<b>').replace(/\n/g,'<br>')}</div>`;
  document.getElementById('chat').appendChild(d);
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}

// 5. PWA
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js');
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(() => {
    const btn = document.createElement('button');
    btn.innerText = '⬇️ Install CyberGPT Pro';
    btn.style = "position:fixed; bottom:90px; right:20px; z-index:999; padding:12px 20px; border-radius:25px; background:#8ab4f8; color:#000; border:none; font-weight:600;";
    btn.onclick = () => deferredPrompt.prompt();
    document.body.appendChild(btn);
  }, 3000);
});
</script>
</body>
</html>
