<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberLabGPT-pro</title>
  <style>
    body { background: #000428; color: white; font-family: Arial; padding: 20px; max-width: 700px; margin: auto; }
    #chatBox { border: 1px solid #0007AFF; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
  .user { text-align: right; color: #00ff88; margin: 8px 0; }
  .ai { text-align: left; color: #00aaff; margin: 8px 0; }
    input { width: 65%; padding: 12px; border-radius: 8px; border: none; }
    button { padding: 12px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    #hifi { background: #0007AFF; color: white; }
    #micBtn { background: #00ff88; color: black; }
    #stopBtn { background: red; color: white; }
  </style>
</head>
<body>

  <h1>raza7x.hacker gpt 🤖</h1>

  <div id="chatBox"></div>

  <input type="text" id="userInput" placeholder="Yaha likho ya bolo...">
  <button id="hifi">Send</button>
  <button id="micBtn">🎤 Bolo</button>
  <button id="stopBtn" style="display:none;">🔇 Stop</button>

<script>
const GROK_API_KEY = "YOUR_GROK_API_KEY"; // <-- Yaha apni Grok API key daalo

// ========== 1. GROK API SE BAAT ==========
document.getElementById('hifi').onclick = async () => {
  const input = document.getElementById('userInput');
  const text = input.value;
  if(!text) return;

  // User ka msg show
  document.getElementById('chatBox').innerHTML += `<div class="user">You: ${text}</div>`;
  input.value = '';
  document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;

  // Grok API Call
  try {
    const response = await fetch("https://api.x.ai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${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}`
      },
      body: JSON.stringify({
        "model": "grok-beta", // ya "grok-2-latest"
        "messages": [{"role": "user", "content": text}],
        "stream": false
      })
    });

    const data = await response.json();
    const aiReply = data.choices[0].message.content;

    showAIReply(aiReply); // Reply show + bolega

  } catch (error) {
    showAIReply("Error: API se connect nahi ho paaya");
    console.error(error);
  }
}

// AI Reply show + Bolna
function showAIReply(aiText){
    document.getElementById('chatBox').innerHTML += `<div class="ai">AI: ${aiText}</div>`;
    speak(aiText); // <-- AI ko bolwana
    document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
}

// Enter dabane se bhi send ho
document.getElementById('userInput').addEventListener("keypress", function(e) {
  if (e.key === "Enter") document.getElementById('hifi').click();
});

// ========== 2. LIVE VOICE CODE ==========
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.lang = 'hi-IN'; // Hindi. English: 'en-US'
recognition.continuous = false;

const micBtn = document.getElementById('micBtn');
const stopBtn = document.getElementById('stopBtn');

micBtn.onclick = () => {
  recognition.start();
  micBtn.style.display = 'none';
  stopBtn.style.display = 'inline-block';
}

stopBtn.onclick = () => recognition.stop();

recognition.onresult = (event) => {
  const voiceText = event.results[0][0].transcript;
  document.getElementById('userInput').value = voiceText;
  document.getElementById('hifi').click(); // hifi button auto click
}

recognition.onend = () => {
  micBtn.style.display = 'inline-block';
  stopBtn.style.display = 'none';
}

// 3. BOLNE WALA FUNCTION
function speak(text){
  window.speechSynthesis.cancel();
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = 'hi-IN'; // Hindi voice. English: 'en-US'
  speech.rate = 1;
  window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
