<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberLabGPT Pro</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d0d11">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #16192b 0%, #090a10 100%);
      --glass-bg: rgba(22, 26, 43, 0.45);
      --glass-border: rgba(255, 255, 255, 0.07);
      --accent-cyan: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.25);
      --text-main: #ffffff;
      --text-muted: #8a8f9f;
      --input-bg: rgba(30, 35, 58, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a10;
      color: var(--text-main);
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at 50% 50%, rgba(20, 24, 46, 0.4) 0%, transparent 80%);
    }

    .header {
      width: 100%;
      max-width: 800px;
      text-align: center;
      margin-top: 5vh;
      animation: fadeIn 1s ease-out;
    }

    .brand h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 70%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 40px rgba(0, 240, 255, 0.1);
      line-height: 1.3;
    }

    .brand p.tag {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 400;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 840px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      margin: 2rem 0;
      padding-right: 8px;
    }

    .chat-wrapper::-webkit-scrollbar {
      width: 6px;
    }
    .chat-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-wrapper::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .chatBox {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .message {
      display: flex;
      width: 100%;
      animation: messageSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .message.user {
      justify-content: flex-end;
    }

    .message .bubble {
      max-width: 75%;
      padding: 1rem 1.25rem;
      border-radius: 18px;
      font-size: 0.98rem;
      line-height: 1.6;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .message.user .bubble {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.ai .bubble {
      background: rgba(13, 15, 28, 0.6);
      border: 1px solid var(--glass-border);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .composer-container {
      width: 100%;
      max-width: 800px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 0.75rem 1rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .composer-container:focus-within {
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }

    .composer-top {
      flex: 1;
    }

    .composer-top textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 1.05rem;
      resize: none;
      height: 24px;
      max-height: 150px;
      line-height: 1.5;
      display: block;
    }

    .composer-top textarea::placeholder {
      color: var(--text-muted);
    }

    .btn-send {
      background: #ffffff;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-send:hover {
      transform: scale(1.08);
      background: var(--accent-cyan);
      box-shadow: 0 0 15px var(--accent-cyan);
    }

    .btn-send svg {
      width: 16px;
      height: 16px;
      fill: #090a10;
    }

    .btn-send.loading {
      background: rgba(255, 255, 255, 0.2) !important;
      cursor: not-allowed;
      animation: pulse 1.5s infinite;
    }

    .footer {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
      letter-spacing: 0.02em;
    }

    .footer a {
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      margin: 0 4px;
      border-bottom: 1px solid transparent;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes messageSlide {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <main class="container">
    <header class="header" id="welcomeHeader">
      <div class="brand">
        <h1>Mujhse kuch bhi apne education ke bare me pucho</h1>
        <p class="tag">Get instant learning guidance, explanations, and academic support.</p>
      </div>
    </header>

    <div class="chat-wrapper" id="chatWrapper" style="display: none;">
      <section id="chatBox" class="chatBox" aria-live="polite"></section>
    </div>

    <div class="composer-container">
      <div class="composer-top">
        <textarea id="userInput" placeholder="Ask CyberLabGPT Pro" rows="1"></textarea>
      </div>
      <button id="hifi" class="btn-send" title="Send message">
        <svg viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
      </button>
    </div>

    <footer class="footer">
      By messaging CyberLabGPT Pro, you agree to our <a href="#">Terms</a> and have read our <a href="#">Privacy Policy</a>.
    </footer>
  </main>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.z = 400;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const particleCount = 130;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    
    for(let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 800;
      positions[i+1] = (Math.random() - 0.5) * 800;
      positions[i+2] = (Math.random() - 0.5) * 400;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      color: 0x00f0ff,
      size: 3,
      transparent: true,
      opacity: 0.45,
      blending: THREE.AdditiveBlending
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - window.innerWidth / 2) * 0.05;
      mouseY = (e.clientY - window.innerHeight / 2) * 0.05;
    });

    function animate() {
      requestAnimationFrame(animate);
      particleSystem.rotation.x += 0.0008;
      particleSystem.rotation.y += 0.0005;
      camera.position.x += (mouseX - camera.position.x) * 0.05;
      camera.position.y += (-mouseY - camera.position.y) * 0.05;
      camera.lookAt(scene.position);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function escapeHtml(str){
      if(!str) return '';
      return str.replace(/[&<>\"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));
    }

    const chatBox = document.getElementById('chatBox');
    const chatWrapper = document.getElementById('chatWrapper');
    const welcomeHeader = document.getElementById('welcomeHeader');
    const sendBtn = document.getElementById('hifi');
    const inputEl = document.getElementById('userInput');

    inputEl.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight - 10) + 'px';
    });

    async function sendQuestion(){
      const text = inputEl.value.trim();
      if(!text) return;

      if(welcomeHeader.style.display !== 'none') {
        welcomeHeader.style.display = 'none';
        chatWrapper.style.display = 'flex';
      }

      appendMessage('user', text);
      setBusy(true);
      inputEl.value = '';
      inputEl.style.height = '24px';

      try{
        const res = await fetch('/ask', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ question: text })
        });
        const data = await res.json();
        if(res.ok){
          appendMessage('ai', data.answer || 'No response');
        } else {
          appendMessage('ai', 'Error: ' + (data.error || 'Server issue'));
        }
      } catch(err){
        appendMessage('ai', 'Connection failed. Please try again.');
        console.error(err);
      } finally{
        setBusy(false);
      }
    }

    function appendMessage(who, text){
      const div = document.createElement('div');
      div.className = 'message ' + who;
      if (who === 'ai') {
        div.innerHTML = `<div class="bubble">${marked.parse(text)}</div>`;
      } else {
        div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
      }
      chatBox.appendChild(div);
      chatWrapper.scrollTop = chatWrapper.scrollHeight;
    }

    function setBusy(flag){
      if(flag){
        sendBtn.disabled = true; 
        sendBtn.classList.add('loading');
      } else {
        sendBtn.disabled = false; 
        sendBtn.classList.remove('loading');
      }
    }

    sendBtn.addEventListener('click', sendQuestion);
    inputEl.addEventListener('keypress', e => { 
      if(e.key === 'Enter' && !e.shiftKey) { 
        e.preventDefault(); 
        sendQuestion(); 
      } 
    });
  </script>
</body>
</html>
